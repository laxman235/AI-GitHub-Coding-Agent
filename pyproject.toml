[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-coding-agent"
version = "1.0.0"
description = "Autonomous Multi-Agent System for Java Spring Boot Repositories using Groq, LangChain, and Maven"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Agent Team" }
]
dependencies = [
    "groq>=0.11.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
agent = "agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
