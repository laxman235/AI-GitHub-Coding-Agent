name: Daily Autonomous Coding Agent

on:
  schedule:
    # Runs every morning at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (simulation only, no remote push)'
        required: true
        type: boolean
        default: false
      max_tasks:
        description: 'Maximum tasks to attempt in this run (up to 2 for daily sprint)'
        required: true
        type: number
        default: 2
      target_branch:
        description: 'Branch to target (creates PRs for human approval)'
        required: true
        type: string
        default: 'develop'
      auto_merge:
        description: 'Automatically merge approved tasks (False enforces human approval)'
        required: true
        type: boolean
        default: false
      target_path:
        description: 'Relative path to Java Spring Boot application'
        required: false
        type: string
        default: 'sample-spring-boot-app'

concurrency:
  group: autonomous-agent-execution
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'develop' }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git User & Attach Local Branch
        run: |
          git config user.name "Autonomous AI Coding Agent"
          git config user.email "agent@users.noreply.github.com"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'develop' }}"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" 2>/dev/null || git checkout "$TARGET_BRANCH"

      - name: Ensure Working Directories
        run: |
          mkdir -p data reports

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20 (for CareerPilot UI verification)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Task History & Sprint State Cache
        uses: actions/cache/restore@v4
        id: db-cache
        with:
          path: |
            data/agent_tasks.db
            data/sprint_state.json
          key: agent-state-${{ github.run_id }}
          restore-keys: |
            agent-state-

      - name: Run Autonomous AI Coding Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name || 'AI-GitHub-Coding-Agent' }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'develop' }}
          AUTO_MERGE: ${{ github.event.inputs.auto_merge || 'false' }}
          TARGET_REPO_PATH: ${{ github.event.inputs.target_path || 'sample-spring-boot-app' }}
          MAX_DAILY_TASKS: ${{ github.event.inputs.max_tasks || 2 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          python -m agent.main --verbose

      - name: Save Updated SQLite Task History & Sprint State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/agent_tasks.db
            data/sprint_state.json
          key: agent-state-${{ github.run_id }}

      - name: Upload Daily Execution Reports & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-agent-reports-${{ github.run_id }}
          path: |
            reports/
            data/agent_tasks.db
          retention-days: 30

      - name: Publish Daily Summary to GitHub Actions Job Summary
        if: always()
        run: |
          LATEST_REPORT=$(ls -t reports/*.md 2>/dev/null | head -n 1)
          if [ -f "$LATEST_REPORT" ]; then
            cat "$LATEST_REPORT" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Execution completed without a generated markdown report." >> $GITHUB_STEP_SUMMARY
          fi
