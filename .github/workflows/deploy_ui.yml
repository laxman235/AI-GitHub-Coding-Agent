name: Deploy CareerPilot UI to Firebase Hosting

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'careerpilot-ui/**'
      - '.github/workflows/deploy_ui.yml'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Deploy target channel (live or preview)'
        required: true
        type: choice
        options:
          - live
          - preview
        default: live

permissions:
  contents: read
  checks: write
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'careerpilot-ui/package-lock.json'

      - name: Install Dependencies
        working-directory: careerpilot-ui
        run: npm ci

      - name: Build React Application
        working-directory: careerpilot-ui
        run: npm run build

      - name: Deploy to Firebase Hosting (Service Account)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERPILOT_AI_CD651 }}
          channelId: ${{ github.event.inputs.target_channel || 'live' }}
          projectId: careerpilot-ai-cd651
          entryPoint: careerpilot-ui
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERPILOT_AI_CD651 != '' }}

      - name: Deploy to Firebase Hosting (CI Token Fallback)
        if: env.HAS_SERVICE_ACCOUNT != 'true' && env.HAS_FIREBASE_TOKEN == 'true'
        working-directory: careerpilot-ui
        run: |
          npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project careerpilot-ai-cd651
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERPILOT_AI_CD651 != '' }}
          HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
