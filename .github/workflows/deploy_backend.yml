name: Deploy Spring Boot Backend to Cloud Run

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'sample-spring-boot-app/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERPILOT_AI_CD651 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package with Maven
        working-directory: sample-spring-boot-app
        run: mvn clean package -DskipTests

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy careerpilot-backend \
            --source sample-spring-boot-app \
            --region us-central1 \
            --allow-unauthenticated \
            --project careerpilot-ai-cd651 \
            --quiet
